name: smededwards-portfolio
x-php: &php
  build:
    context: .
    dockerfile: docker/php/Dockerfile
    args:
      PHP_IMAGE: ${PHP_IMAGE:-php:8.4-fpm-bookworm@sha256:df5a5113e1179ddf4560cd15727eb3812f6457829756d2a96c6c11bb4c250089}
      COMPOSER_IMAGE: ${COMPOSER_IMAGE:-composer:2.8.12@sha256:5248900ab8b5f7f880c2d62180e40960cd87f60149ec9a1abfd62ac72a02577c}
  working_dir: /workspace/site
  volumes:
    - ../:/workspace
  environment:
    WP_CLI_ALLOW_ROOT: '1'
services:
  php:
    <<: *php
    user: "${LOCAL_UID:-501}:${LOCAL_GID:-20}"
    depends_on:
      db:
        condition: service_healthy
  tools:
    <<: *php
    profiles: [tools]
    entrypoint: []
  nginx:
    image: ${NGINX_IMAGE:-nginx:1.30.6-alpine@sha256:47928bf67eb62a1863cb08d9ecb52d3e704304ba614eaee17884204677702951}
    ports:
      - '127.0.0.1:${HTTP_PORT:-80}:80'
      - '127.0.0.1:${HTTPS_PORT:-443}:443'
    volumes:
      - ../:/workspace:ro
      - ./.docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./.docker/certs:/etc/nginx/certs:ro
    depends_on: [php]
  db:
    image: ${DB_IMAGE:-mariadb:10.11.19@sha256:0d0945c57f75b3a3b9ebe71aedaaad005fa5305054e8fca3d2e42a8c92b43b5e}
    environment:
      MARIADB_DATABASE: ${DB_NAME}
      MARIADB_USER: ${DB_USER}
      MARIADB_PASSWORD: ${DB_PASSWORD}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    volumes:
      - database:/var/lib/mysql
    healthcheck:
      test: [CMD, healthcheck.sh, --connect, --innodb_initialized]
      interval: 5s
      timeout: 5s
      retries: 30
  node:
    image: ${NODE_IMAGE:-node:24.22.1-bookworm-slim@sha256:55fb5f5a527ea2c5c4a95f963e48ef90aa38c7b346054fdc8ee9957a2b55d205}
    profiles: [tools]
    working_dir: /workspace
    volumes:
      - ../:/workspace
  mailpit:
    image: ${MAILPIT_IMAGE:-axllent/mailpit:latest@sha256:0790692be935ea4420d085694f7985b1f692ca6a8771ab0e0bd8ba75ac180498}
    ports:
      - '127.0.0.1:${MAILPIT_PORT:-8025}:8025'
volumes:
  database:
